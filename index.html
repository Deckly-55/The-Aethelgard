<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Survival.io</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- Login overlay: covers the whole screen until the server confirms the login -->
  <div id="loginOverlay">
    <div id="loginBox">
      <h1>Survival.io</h1>
      <input id="usernameInput" type="text" placeholder="Username" maxlength="20" autocomplete="off" autofocus>
      <button id="playButton">Play Game</button>
      <p id="loginError"></p>
    </div>
  </div>

  <!-- Socket.io client, served automatically by the Socket.io server -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- The game (game.js creates the socket connection itself) -->
  <script src="game.js"></script>
</body>
</html>
